name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 04:00 UTC
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Sending keep-alive ping to Supabase REST endpoint..."
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/websites?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "Ping completed"
